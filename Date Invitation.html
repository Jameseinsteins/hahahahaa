<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Will you go on a date with me?</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff1f5;--ink:#3a0f2b;--soft:#8a4f6b;--berry:#ee3d73;--berry-d:#b81f50;--line:#f0c3d3;--on:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#26101e;--ink:#ffe8f0;--soft:#dba5bd;--berry:#ff5c8a;--berry-d:#ff90ae;--line:#6e3552;--on:#2a0a18;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#26101e;--ink:#ffe8f0;--soft:#dba5bd;--berry:#ff5c8a;--berry-d:#ff90ae;--line:#6e3552;--on:#2a0a18;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,sans-serif;font-weight:600;overflow-x:hidden}
h1,button{font-family:"Fredoka","Nunito",system-ui,sans-serif}
[hidden]{display:none!important}
main{max-width:440px;margin:0 auto;padding:40px 20px;text-align:center}
h1{font-size:clamp(1.8rem,8vw,2.4rem);line-height:1.15;margin:0 0 8px;font-weight:600}
p{margin:0}
.sub{color:var(--soft);min-height:3em;margin-top:6px}
button{cursor:pointer;border:0;color:inherit;font-weight:600}
button:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
#art{position:relative;width:min(220px,58vw);margin:18px auto 0}#art img{width:100%;height:auto;display:block}#mood{position:absolute;top:-6px;right:-6px;font-size:2rem}
.row{display:flex;justify-content:center;align-items:center;gap:16px;margin-top:24px;min-height:80px}
.go,#yes{background:var(--berry);color:var(--on);font-size:1.2rem;padding:.65em 1.7em;border-radius:999px}
.go:hover,#yes:hover{background:var(--berry-d)}
.go:disabled{opacity:.4;cursor:not-allowed}
#yes{transition:transform .3s}
#no{background:transparent;border:2px solid var(--line);font-size:1.05rem;padding:.6em 1.3em;border-radius:999px;z-index:20;transition:left .25s,top .25s}
.ghost{background:none;color:var(--soft);margin-top:14px;padding:.5em 1em;font-size:1rem}
label{display:block;text-align:left;margin:24px 0 8px;color:var(--soft)}
input[type=date]{width:100%;font:inherit;font-weight:600;color:var(--ink);background:transparent;border:2px solid var(--line);border-radius:14px;padding:.7em .9em}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:2px solid var(--line);background:transparent;border-radius:14px;padding:.8em .5em;font-size:1rem}
.opt[aria-pressed="true"]{background:var(--berry);border-color:var(--berry);color:var(--on)}
.bob{animation:bob 1.4s ease-in-out infinite}.shake{animation:shk .3s linear infinite}
@keyframes bob{50%{transform:translateY(-6px)}}@keyframes shk{25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}
.tear{animation:tear 1s ease-in infinite;transform-box:fill-box}
@keyframes tear{to{transform:translateY(40px);opacity:0}}
.sum{white-space:pre-wrap;margin:20px 0;font-size:1.1rem;line-height:1.6}
@media (prefers-reduced-motion:reduce){.bob,.shake{animation:none!important}}
</style>
</head>

    <p class="sub" id="cap" aria-live="polite"></p>
    <div class="row" id="row">
      <button id="yes">Yes</button>
      <button id="no">No</button>
    </div>
  </section>

  <section id="planner" hidden>
    <h1>Yay! Let’s plan it</h1>
    <label for="d">Pick a day</label>
    <input type="date" id="d">
    <label>What kind of date?</label>
    <div class="opts" id="types"></div>
    <p class="sub" id="err" role="alert"></p>
    <button class="go" id="lock">Confirm</button>
  </section>

  <section id="done" hidden>
    <h1>It’s a date!</h1>
    <p class="sum" id="sum"></p>
    <button class="go" id="copy">Copy message</button><br>
    <button class="ghost" id="edit">Change plans</button>
    <p class="sub" id="copied" aria-live="polite"></p>
  </section>
</main>

<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var CAPS=["","Please? 🥺","Pretty please…","I’m about to cry…","I’ll buy the snacks!","Look how big the Yes button is now."];
  var TYPES=["🍝 Dinner","🎬 Movie","☕ Coffee","🧺 Picnic","🎮 Arcade","🌅 Sunset walk"];
  var tries=0,type="",msg="";

  var MOODS=["","","😢","😭","🥹","😭"];
  function setMood(l){$("pet").className=l>=2?"shake":"bob";$("mood").textContent=MOODS[l]}

  var no=$("no"),yes=$("yes");
  no.addEventListener("click",function(e){
    e.preventDefault();tries++;
    var l=Math.min(tries,5);
    setMood(l);$("cap").textContent=CAPS[l];
    var s=Math.min(1+tries*.3,innerWidth<480?1.8:2.4);
    yes.style.transform="scale("+s+")";$("row").style.minHeight=(80+(s-1)*50)+"px";
    var w=no.offsetWidth,h=no.offsetHeight,y=yes.getBoundingClientRect(),x0,y0,k=0;
    no.style.position="fixed";
    do{x0=14+Math.random()*Math.max(1,innerWidth-w-28);y0=14+Math.random()*Math.max(1,innerHeight-h-28);k++}
    while(k<25&&x0<y.right+10&&x0+w>y.left-10&&y0<y.bottom+10&&y0+h>y.top-10);
    no.style.left=x0+"px";no.style.top=y0+"px";
  });
  yes.addEventListener("click",function(){location.hash="planner"});

  var tg=$("types");
  TYPES.forEach(function(t){
    var b=document.createElement("button");b.type="button";b.className="opt";b.textContent=t;b.setAttribute("aria-pressed","false");
    b.onclick=function(){type=t;[].forEach.call(tg.children,function(c){c.setAttribute("aria-pressed","false")});b.setAttribute("aria-pressed","true");$("err").textContent=""};
    tg.appendChild(b);
  });
  var n=new Date();n.setMinutes(n.getMinutes()-n.getTimezoneOffset());$("d").min=n.toISOString().slice(0,10);

  $("lock").onclick=function(){
    var v=$("d").value;
    if(!v){$("err").textContent="Pick a day first.";return}
    if(!type){$("err").textContent="Choose a type of date.";return}
    var p=v.split("-"),ds=new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});
    msg="I said yes! 💖\nDate: "+ds+"\nPlan: "+type;
    $("sum").textContent=msg;$("copied").textContent="";
    location.hash="done";
  };
  $("copy").onclick=function(){
    function ok(){$("copied").textContent="Copied! Paste it in your chat."}
    function bad(){$("copied").textContent="Couldn’t copy. Select the text above instead."}
    try{navigator.clipboard.writeText(msg).then(ok,bad)}catch(e){bad()}
  };
  $("edit").onclick=function(){location.hash="planner"};

  function route(){
    var k=location.hash.replace("#","");
    if(k==="done"&&!msg)k="planner";
    if(k!=="planner"&&k!=="done")k="invite";
    ["invite","planner","done"].forEach(function(v){$(v).hidden=v!==k});
    no.style.visibility=k==="invite"?"visible":"hidden";
    scrollTo(0,0);
  }
  addEventListener("hashchange",route);route();
})();
</script>
</body>
</html>
